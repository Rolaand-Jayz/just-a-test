name: Capture public website baseline

on:
  push:
    paths:
      - ".github/workflows/capture.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rescue1-public-baseline
  cancel-in-progress: false

jobs:
  capture:
    name: Capture visitor-visible Squarespace site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install capture dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2

      - name: Capture source HTML and linked public assets
        run: python scripts/capture.py

      - name: Commit captured baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "Capture public Rescue 1 Movers site baseline"
            git push origin HEAD:main
          fi
