name: Deploy website preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage existing business photography and branding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/original
          if [ ! -s 'site/assets/original/logo.png' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/logo.png' -o 'site/assets/original/logo.png'
          fi
          if [ ! -s 'site/assets/original/logo-white.png' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/logo-white.png' -o 'site/assets/original/logo-white.png'
          fi
          if [ ! -s 'site/assets/original/cloisters-bennett.jpg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/cloisters-bennett.jpg' -o 'site/assets/original/cloisters-bennett.jpg'
          fi
          if [ ! -s 'site/assets/original/southern-trace.jpg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/southern-trace.jpg' -o 'site/assets/original/southern-trace.jpg'
          fi
          if [ ! -s 'site/assets/original/woodland-hills.jpg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/woodland-hills.jpg' -o 'site/assets/original/woodland-hills.jpg'
          fi
          if [ ! -s 'site/assets/original/stone-forest.jpg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/stone-forest.jpg' -o 'site/assets/original/stone-forest.jpg'
          fi
          if [ ! -s 'site/assets/original/sun-meadows.jpg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/sun-meadows.jpg' -o 'site/assets/original/sun-meadows.jpg'
          fi
          if [ ! -s 'site/assets/original/park-meadow.jpg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/park-meadow.jpg' -o 'site/assets/original/park-meadow.jpg'
          fi
          if [ ! -s 'site/assets/original/williams-gate.jpg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/williams-gate.jpg' -o 'site/assets/original/williams-gate.jpg'
          fi
          if [ ! -s 'site/assets/original/copperfield.jpg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/copperfield.jpg' -o 'site/assets/original/copperfield.jpg'
          fi
          if [ ! -s 'site/assets/original/estates-river-run.jpg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/estates-river-run.jpg' -o 'site/assets/original/estates-river-run.jpg'
          fi
          if [ ! -s 'site/assets/original/tiffany.jpg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/tiffany.jpg' -o 'site/assets/original/tiffany.jpg'
          fi
          if [ ! -s 'site/assets/original/lauren.jpeg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/lauren.jpeg' -o 'site/assets/original/lauren.jpeg'
          fi
          if [ ! -s 'site/assets/original/katy.jpg' ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 75 'https://rolaand-jayz.github.io/just-a-test/assets/original/katy.jpg' -o 'site/assets/original/katy.jpg'
          fi
          file site/assets/original/*
      - name: Preserve original public-site photos and branding in source
        shell: bash
        continue-on-error: true
        run: |
          git config user.name 'Rolaand-Jayz'
          git config user.email '162228733+Rolaand-Jayz@users.noreply.github.com'
          git add site/assets/original
          if ! git diff --cached --quiet; then
            git commit -m 'chore(assets): preserve original ASBCS photography and branding'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
